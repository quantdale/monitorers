name: E2E Verification Harness

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E — mock-data harness
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: sys-monitor-tauri
    steps:
      # v7.0.1 — 3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.0.0 — 820762786026740c76f36085b0efc47a31fe5020
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sys-monitor-tauri/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      # Reuse the downloaded Chromium across runs; the lockfile key captures the
      # pinned @playwright/test version (and with it the browser build). On a
      # miss the install step below repopulates the cache as before.
      # v6.1.0 — 55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~\AppData\Local\ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('sys-monitor-tauri/package-lock.json') }}

      - name: Install Playwright browsers (chromium)
        run: npx playwright install chromium

      - name: Build the frontend
        run: npm run build

      - name: Run E2E tests (mock-data harness on Vite dev server)
        run: npm run verify:e2e

      # v7.0.1 — 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report
          path: sys-monitor-tauri/playwright-report/
          retention-days: 30
          if-no-files-found: warn
