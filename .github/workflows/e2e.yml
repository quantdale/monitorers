name: E2E Verification Harness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sys-monitor-tauri/package-lock.json

      - name: Install frontend dependencies
        working-directory: sys-monitor-tauri
        run: npm ci

      - name: Install Playwright browsers (chromium)
        working-directory: sys-monitor-tauri
        run: npx playwright install chromium

      - name: Build the frontend
        working-directory: sys-monitor-tauri
        run: npm run build

      - name: Run E2E tests (mock-data harness on Vite dev server)
        working-directory: sys-monitor-tauri
        run: npx playwright test --config e2e/playwright.config.ts --reporter=html

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: sys-monitor-tauri/e2e/playwright-report/
          retention-days: 30
