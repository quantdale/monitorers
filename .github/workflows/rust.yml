# Rust, frontend, and Windows release gates for sys-monitor-tauri.
name: Rust and release

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust — verify
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sys-monitor-tauri
    steps:
      # v7.0.1 — 3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.0.0 — 820762786026740c76f36085b0efc47a31fe5020
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sys-monitor-tauri/package-lock.json

      # v6.1.0 — 55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sys-monitor-tauri/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('sys-monitor-tauri/src-tauri/Cargo.lock', 'sys-monitor-tauri/src-tauri/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --version 0.22.1 --locked --quiet

      - name: Run canonical Rust gate
        run: npm run verify:rust

  frontend:
    name: Frontend — verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sys-monitor-tauri
    steps:
      # v7.0.1 — 3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.0.0 — 820762786026740c76f36085b0efc47a31fe5020
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sys-monitor-tauri/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run canonical frontend gate
        run: npm run verify:frontend

  tauri-build:
    name: Windows — production executable
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sys-monitor-tauri
    steps:
      # v7.0.1 — 3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.0.0 — 820762786026740c76f36085b0efc47a31fe5020
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sys-monitor-tauri/package-lock.json

      # v6.1.0 — 55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sys-monitor-tauri/src-tauri/target
          key: ${{ runner.os }}-tauri-${{ hashFiles('sys-monitor-tauri/src-tauri/Cargo.lock', 'sys-monitor-tauri/src-tauri/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-tauri-

      - name: Install dependencies
        run: npm ci

      - name: Build the production executable
        run: npm run verify:tauri

      # v7.0.1 — 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      - name: Upload executable
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sys-monitor-tauri-windows-executable
          path: sys-monitor-tauri/src-tauri/target/release/sys-monitor-tauri.exe
          if-no-files-found: warn

  tauri-installer:
    name: Windows — MSI and NSIS bundle
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    defaults:
      run:
        working-directory: sys-monitor-tauri
    steps:
      # v7.0.1 — 3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.0.0 — 820762786026740c76f36085b0efc47a31fe5020
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sys-monitor-tauri/package-lock.json

      # v6.1.0 — 55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sys-monitor-tauri/src-tauri/target
          key: ${{ runner.os }}-bundle-${{ hashFiles('sys-monitor-tauri/src-tauri/Cargo.lock', 'sys-monitor-tauri/src-tauri/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-bundle-

      - name: Install dependencies
        run: npm ci

      - name: Build MSI and NSIS installers
        run: npx tauri build

      # v7.0.1 — 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sys-monitor-tauri-windows-installers
          path: sys-monitor-tauri/src-tauri/target/release/bundle/
          if-no-files-found: warn
