# CI for the user-simulation platform (e2e/sim).
#
# The mock lane is a required PR/push gate. The packaged lane remains manual
# because it needs a Windows app build and WebView2/CDP process control.
name: Simulation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  simulation-config-lint:
    name: Simulation — config lint
    runs-on: ubuntu-latest
    steps:
      # v7.0.1 — 3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: No remote-debugging flag in shipped config/build scripts
        shell: bash
        run: |
          if grep -rniE "remote-debugging|remote-debug-port|--remote-debug" \
            sys-monitor-tauri/src-tauri/tauri.conf.json \
            sys-monitor-tauri/src-tauri/capabilities/ \
            sys-monitor-tauri/package.json \
            sys-monitor-tauri/vite.config.ts 2>/dev/null; then
            echo "ERROR: remote-debugging flag found in shipped configuration" >&2
            exit 1
          fi
          echo "OK: no remote-debugging flag in shipped configuration"

      # The supervised-recovery campaign proves recovery behavior through
      # test-only seams (#[cfg(test)] synthetic providers). This lint pins that
      # contract: no cargo feature beyond the documented set (a future "fault"
      # feature would be an unreviewed production surface), and no env-var or
      # function seam capable of crashing/perturbing the collector in non-test
      # backend sources.
      - name: No collector fault-injection surface in shipped build
        shell: pwsh
        run: |
          $cargo = Get-Content sys-monitor-tauri/src-tauri/Cargo.toml -Raw
          if ($cargo -notmatch '(?m)^\[features\]\s*$') { throw "Cargo.toml missing [features] table" }
          $after = ($cargo -split '(?m)^\[features\]\s*$', 2)[1]
          $table = (($after -split '(?m)^\[', 2)[0])
          $names = ($table | Select-String '(?m)^([A-Za-z0-9_-]+)\s*=' -AllMatches).Matches |
            ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique
          $expected = @('custom-protocol','default','nvapi','nvml') | Sort-Object
          $diff = Compare-Object $names $expected
          if ($diff) {
            $diff | ForEach-Object { Write-Host "unexpected/missing feature: $($_.InputObject)" }
            throw "cargo features diverge from the documented shipped set"
          }
          Write-Host "OK: cargo features are exactly the documented set ($($names -join ', '))"

          $hits = Get-ChildItem sys-monitor-tauri/src-tauri/src -Recurse -Filter *.rs |
            Select-String -Pattern 'SYSMON_(CRASH|FAULT|PANIC)|inject_fault|fault_injection|crash_collector'
          if ($hits) {
            $hits | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            throw "collector fault-injection surface found in non-test backend sources"
          }
          Write-Host "OK: no collector fault-injection surface in shipped backend"

  simulation-mock:
    name: Simulation — mock lane
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sys-monitor-tauri
    steps:
      # v7.0.1 — 3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.0.0 — 820762786026740c76f36085b0efc47a31fe5020
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sys-monitor-tauri/package-lock.json

      - name: Install deps
        run: npm ci

      # Reuse the downloaded Chromium across runs; the lockfile key captures the
      # pinned @playwright/test version (and with it the browser build). On a
      # miss the install step below repopulates the cache as before.
      # v6.1.0 — 55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      - name: Cache Playwright Chromium
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~\AppData\Local\ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('sys-monitor-tauri/package-lock.json') }}

      - name: Install Playwright chromium
        run: npx playwright install chromium

      - name: Run canonical mock simulation gate
        run: npm run verify:sim

      # v7.0.1 — 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      - name: Upload simulation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sim-mock-results
          path: sys-monitor-tauri/e2e-results/sim/**/*
          if-no-files-found: warn

  simulation-real:
    name: Simulation — packaged lane
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        working-directory: sys-monitor-tauri
    steps:
      # v7.0.1 — 3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # v7.0.0 — 820762786026740c76f36085b0efc47a31fe5020
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: sys-monitor-tauri/package-lock.json

      # The repository rust-toolchain.toml pins the compiler/components.
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            sys-monitor-tauri/src-tauri/target
          key: ${{ runner.os }}-sim-real-${{ hashFiles('sys-monitor-tauri/src-tauri/Cargo.lock', 'sys-monitor-tauri/src-tauri/rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-sim-real-
            ${{ runner.os }}-cargo-

      - name: Install deps
        run: npm ci

      - name: Build packaged app (no bundle)
        run: npx tauri build --no-bundle

      - name: Run packaged-lane simulation
        env:
          SIM_LANE: real
          SIM_APP_EXE: src-tauri/target/release/sys-monitor-tauri.exe
        run: npm run sim:real

      # v7.0.1 — 043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      - name: Upload simulation artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sim-real-results
          path: sys-monitor-tauri/e2e-results/sim/**/*
          if-no-files-found: warn
