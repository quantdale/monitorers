[package]
name = "sys-monitor-tauri"
version = "0.1.4"
description = "System Monitor — Tauri + React/TypeScript"
authors = ["quantdale"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
wmi = "0.13"
chrono = "0.4"
nvapi-sys = { version = "0.1.3", optional = true }
nvml-wrapper = { version = "0.10", optional = true }
windows = { version = "0.61", features = [
    "Win32_System_Performance",
    "Win32_Foundation",
] }

[dev-dependencies]
# Headless MockRuntime app for exercising the REAL managed-state/command seam
# in bin-target unit tests (type-keyed state resolution cannot be tested
# without a Manager implementation).
tauri = { version = "2", features = ["test"] }

[features]
# This feature is used for production builds or when a dev server is not specified, DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
default = ["nvapi", "nvml"]
# Nvidia GPU temperature via NVAPI. Loads nvapi64.dll at runtime (no build-time deps).
nvapi = ["nvapi-sys"]
# Nvidia GPU metrics via NVML (temperature, power, VRAM, fan, clock). Modern replacement for NVAPI.
nvml = ["nvml-wrapper"]

[profile.release]
opt-level = 3
# Thin local LTO instead of fat: the poller's hot path is PDH/WMI/NVML FFI
# bound and gains nothing user-observable from cross-crate inlining, while fat
# LTO's serial whole-crate codegen dominated every release build. Measured on
# the dev workstation (warm dependency cache; "Compiling sys-monitor-tauri" →
# Finished wall time, which is exactly the phase CI re-pays per build):
#   lto=true,  codegen-units=1    4m45s   exe 9,122,816 B
#   lto="thin", codegen-units=1   3m15s   exe 9,419,776 B   ← adopted (-32%)
#   lto="thin", codegen-units=16  2m22s   exe 10,225,152 B  (+12% size)
# codegen-units stays 1: cu=16 saves another ~50s per build but grows the
# shipped binary another ~800KB with no runtime benefit — flip only if release
# build minutes ever outweigh artifact size for this app.
lto = "thin"
codegen-units = 1
